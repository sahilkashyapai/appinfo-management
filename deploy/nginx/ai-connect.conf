# nginx site for AI Connect — https://ai-connect.dev.appinfoinc.com
# The Node app (server/) listens on 127.0.0.1:5000 and serves both the React
# build and /api; nginx only terminates TLS and forwards everything to it.

server {
    listen 80;
    server_name ai-connect.dev.appinfoinc.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ai-connect.dev.appinfoinc.com;

    # Company certificate for *.dev.appinfoinc.com (paths are examples).
    ssl_certificate     /etc/ssl/appinfoinc/dev.appinfoinc.com.crt;
    ssl_certificate_key /etc/ssl/appinfoinc/dev.appinfoinc.com.key;

    # Uploads (photos, documents, resumes, chat files) arrive as base64 JSON
    # bodies of up to 10 MB; leave headroom for the encoding.
    client_max_body_size 15m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Chat uses WebSockets (socket.io).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s; # PDF/CSV exports
    }
}

# Put this once in the http {} block (e.g. /etc/nginx/conf.d/connection_upgrade.conf)
# if your nginx config doesn't already define it:
#
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
